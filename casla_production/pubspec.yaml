name: casla_production
description: Casla Group — Ứng dụng ghi nhận sản lượng sản xuất
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: 2.6.1
  # Navigation
  go_router: 17.4.0

  # QR/Barcode Scanner
  mobile_scanner: 7.4.0

  # Networking (SAP OData/RAP)
  dio: 5.11.0

  # Utilities
  uuid: 4.6.0
  intl: 0.20.3
  # 12.4+ calls NSProcessInfo.isiOSAppOnVision, which requires a newer Xcode
  # SDK than the current GitHub runner provides.
  device_info_plus: 12.3.0
  logger: 2.7.0

  # UI
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/


