name: Phase 5 Apply Patch

on:
  push:
    branches:
      - chatgpt/phase5-performance-telemetry

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: trigger Phase 5 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 .github/phase5_apply.py
      - name: Format changed Dart files
        working-directory: casla_production
        run: dart format lib test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casla_production
          git commit -m "feat: complete Phase 5 performance telemetry [phase5-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
