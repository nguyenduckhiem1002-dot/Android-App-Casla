name: Phase 12 Normalize

on:
  push:
    branches: ['chatgpt/phase12-lockfile-closure']

permissions:
  contents: write

concurrency:
  group: phase12-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/phase12-lockfile-closure

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Normalize lockfile and Dart formatting
        run: |
          flutter pub get
          dart format lib test

      - name: Commit canonical generated changes
        working-directory: .
        run: |
          if git diff --quiet -- casla_production/pubspec.lock casla_production/test; then
            echo 'Nothing to normalize.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add casla_production/pubspec.lock casla_production/test
          git commit -m 'chore(ci): normalize lockfile and formatting for Flutter 3.44.8'
          git push origin HEAD:chatgpt/phase12-lockfile-closure
