name: Phase 5 Apply

on:
  push:
    branches:
      - chatgpt/phase5-performance-telemetry
    paths:
      - .phase5-trigger4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
      - run: python3 .github/phase5_apply.py
      - working-directory: casla_production
        run: dart format lib test
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add casla_production
          git commit -m 'feat: complete Phase 5 performance telemetry'
          git push origin HEAD:${GITHUB_REF_NAME}
