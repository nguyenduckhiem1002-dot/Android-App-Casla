name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment holding release variables and secrets
        required: true
        type: choice
        options:
          - staging
          - production
      platform:
        description: Platform to validate
        required: true
        type: choice
        options:
          - all
          - android
          - ios
        default: all

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ inputs.target_environment }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    name: Android release preflight
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
          cache-key: release-preflight-${{ runner.os }}-${{ hashFiles('casla_production/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CASLA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::CASLA_ANDROID_KEYSTORE_BASE64 is missing from the selected Environment."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/casla-release.jks"
          chmod 600 "$RUNNER_TEMP/casla-release.jks"

      - name: Run fail-closed release preflight
        shell: bash
        env:
          SAP_BASE_URL: ${{ vars.SAP_BASE_URL }}
          SAP_TRANSPORT_AUTH_MODE: gateway
          ENABLE_DEMO_DATA: 'false'
          CASLA_ANDROID_APPLICATION_ID: ${{ vars.CASLA_ANDROID_APPLICATION_ID }}
          CASLA_ANDROID_STORE_PASSWORD: ${{ secrets.CASLA_ANDROID_STORE_PASSWORD }}
          CASLA_ANDROID_KEY_ALIAS: ${{ secrets.CASLA_ANDROID_KEY_ALIAS }}
          CASLA_ANDROID_KEY_PASSWORD: ${{ secrets.CASLA_ANDROID_KEY_PASSWORD }}
        run: |
          export CASLA_ANDROID_STORE_FILE="$RUNNER_TEMP/casla-release.jks"
          bash tool/release_preflight.sh android

      - name: Build signed production AAB
        shell: bash
        env:
          SAP_BASE_URL: ${{ vars.SAP_BASE_URL }}
          CASLA_ANDROID_APPLICATION_ID: ${{ vars.CASLA_ANDROID_APPLICATION_ID }}
          CASLA_ANDROID_STORE_PASSWORD: ${{ secrets.CASLA_ANDROID_STORE_PASSWORD }}
          CASLA_ANDROID_KEY_ALIAS: ${{ secrets.CASLA_ANDROID_KEY_ALIAS }}
          CASLA_ANDROID_KEY_PASSWORD: ${{ secrets.CASLA_ANDROID_KEY_PASSWORD }}
        run: |
          export CASLA_ANDROID_STORE_FILE="$RUNNER_TEMP/casla-release.jks"
          flutter build appbundle --release --flavor production --no-pub \
            --dart-define=ENABLE_DEMO_DATA=false \
            --dart-define=SAP_TRANSPORT_AUTH_MODE=gateway \
            --dart-define=SAP_BASE_URL="$SAP_BASE_URL"

      - name: Verify AAB exists
        run: test -s build/app/outputs/bundle/productionRelease/app-production-release.aab

  ios:
    name: iOS identity and unsigned archive preflight
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    environment: ${{ inputs.target_environment }}
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
          cache-key: release-preflight-${{ runner.os }}-${{ hashFiles('casla_production/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run fail-closed identity and transport preflight
        shell: bash
        env:
          SAP_BASE_URL: ${{ vars.SAP_BASE_URL }}
          SAP_TRANSPORT_AUTH_MODE: gateway
          ENABLE_DEMO_DATA: 'false'
          CASLA_IOS_BUNDLE_ID: ${{ vars.CASLA_IOS_BUNDLE_ID }}
          CASLA_IOS_TEAM_ID: ${{ vars.CASLA_IOS_TEAM_ID }}
        run: bash tool/release_preflight.sh ios

      - name: Compile production iOS release without signing
        shell: bash
        env:
          SAP_BASE_URL: ${{ vars.SAP_BASE_URL }}
        run: |
          flutter build ios --release --no-codesign --no-pub \
            --dart-define=ENABLE_DEMO_DATA=false \
            --dart-define=SAP_TRANSPORT_AUTH_MODE=gateway \
            --dart-define=SAP_BASE_URL="$SAP_BASE_URL"

      - name: State signing boundary
        run: |
          echo "Unsigned iOS compile passed. Distribution signing still requires"
          echo "certificate/profile or managed signing configured outside source control."
