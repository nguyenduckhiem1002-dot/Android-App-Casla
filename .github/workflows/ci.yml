name: Flutter CI

on:
  push:
    branches: [main, master, develop, 'chatgpt/**']
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('casla_production/pubspec.lock') }}

      - name: Verify Flutter and Dart versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

  android:
    name: Android / PDA build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('casla_production/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Compile production flavor APK including native scanner bridge
        run: >-
          flutter build apk --debug --flavor production --no-pub
          --dart-define=SAP_TRANSPORT_AUTH_MODE=gateway

      - name: Run native scanner trust policy tests
        working-directory: casla_production/android
        run: ./gradlew :app:testProductionDebugUnitTest

      - name: Verify production release fails closed without secrets
        working-directory: casla_production/android
        run: |
          ./gradlew :app:tasks --all | grep -q assembleProductionRelease

          set +e
          output=$(./gradlew :app:verifyCaslaSigning 2>&1)
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::Production signing guard unexpectedly passed in secret-free CI."
            exit 1
          fi

          echo "$output" | grep -q "Production Android release is not configured"

      - name: Verify production release rejects demo data
        working-directory: casla_production/android
        run: |
          demo_define=$(printf 'ENABLE_DEMO_DATA=true' | base64 -w0)
          gateway_define=$(printf 'SAP_TRANSPORT_AUTH_MODE=gateway' | base64 -w0)
          dummy_keystore="$RUNNER_TEMP/casla-ci-dummy.jks"
          touch "$dummy_keystore"

          set +e
          output=$(
            CASLA_ANDROID_APPLICATION_ID=com.casla.ci \
            CASLA_ANDROID_STORE_FILE="$dummy_keystore" \
            CASLA_ANDROID_STORE_PASSWORD=ci-only \
            CASLA_ANDROID_KEY_ALIAS=ci-only \
            CASLA_ANDROID_KEY_PASSWORD=ci-only \
            ./gradlew -Pdart-defines="$demo_define,$gateway_define" :app:verifyCaslaSigning 2>&1
          )
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::Production guard accepted ENABLE_DEMO_DATA=true."
            exit 1
          fi

          echo "$output" | grep -q "ENABLE_DEMO_DATA must not be true for a production release"

      - name: Verify production release requires gateway transport with no Basic secret
        working-directory: casla_production/android
        run: |
          gateway_define=$(printf 'SAP_TRANSPORT_AUTH_MODE=gateway' | base64 -w0)
          basic_define=$(printf 'SAP_TRANSPORT_AUTH_MODE=basic' | base64 -w0)
          basic_user_define=$(printf 'SAP_BASIC_AUTH_USER=ci-user' | base64 -w0)
          basic_password_define=$(printf 'SAP_BASIC_AUTH_PASSWORD=ci-password' | base64 -w0)
          dummy_keystore="$RUNNER_TEMP/casla-ci-transport-dummy.jks"
          touch "$dummy_keystore"

          common_env=(
            CASLA_ANDROID_APPLICATION_ID=com.casla.ci
            CASLA_ANDROID_STORE_FILE="$dummy_keystore"
            CASLA_ANDROID_STORE_PASSWORD=ci-only
            CASLA_ANDROID_KEY_ALIAS=ci-only
            CASLA_ANDROID_KEY_PASSWORD=ci-only
          )

          env "${common_env[@]}" \
            ./gradlew -Pdart-defines="$gateway_define" :app:verifyCaslaSigning

          set +e
          output=$(
            env "${common_env[@]}" \
              ./gradlew -Pdart-defines="$basic_define,$basic_user_define,$basic_password_define" \
              :app:verifyCaslaSigning 2>&1
          )
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::Production guard accepted direct Basic transport."
            exit 1
          fi

          echo "$output" | grep -q "SAP_TRANSPORT_AUTH_MODE must be gateway for a production release"
          echo "$output" | grep -q "SAP_BASIC_AUTH_USER/SAP_BASIC_AUTH_PASSWORD must not be embedded in a production release"

  ios:
    name: iOS / Xcode build
    runs-on: macos-14
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.8
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('casla_production/pubspec.lock') }}

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without signing using production transport mode
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=SAP_TRANSPORT_AUTH_MODE=gateway
          --dart-define=SAP_BASIC_AUTH_USER=CASLA_CI_BASIC_USER_SENTINEL
          --dart-define=SAP_BASIC_AUTH_PASSWORD=CASLA_CI_BASIC_PASSWORD_SENTINEL

      - name: Verify release AOT binary strips Basic credential defines
        run: |
          app_binary="build/ios/iphoneos/Runner.app/Frameworks/App.framework/App"
          test -f "$app_binary"

          if strings "$app_binary" | grep -q 'CASLA_CI_BASIC_.*_SENTINEL'; then
            echo "::error::A SAP Basic credential sentinel was embedded in the iOS release AOT binary."
            exit 1
          fi

      - name: Validate Xcode archive settings
        working-directory: casla_production/ios
        run: >-
          xcodebuild -workspace Runner.xcworkspace
          -scheme Runner
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Verify iOS production identity guard fails closed
        run: |
          set +e
          output=$(bash ios/verify_production_identity.sh 2>&1)
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::iOS production identity guard unexpectedly passed without release values."
            exit 1
          fi

          echo "$output" | grep -q "iOS production identity is not configured"

          CASLA_IOS_BUNDLE_ID=com.casla.ci \
          CASLA_IOS_TEAM_ID=CITEAM1234 \
          SAP_TRANSPORT_AUTH_MODE=gateway \
          bash ios/verify_production_identity.sh

      - name: Verify production transport guard rejects embedded Basic credentials
        run: |
          SAP_TRANSPORT_AUTH_MODE=gateway bash tool/verify_transport_security.sh

          set +e
          output=$(
            SAP_TRANSPORT_AUTH_MODE=gateway \
            SAP_BASIC_AUTH_USER=ci-user \
            SAP_BASIC_AUTH_PASSWORD=ci-password \
            bash tool/verify_transport_security.sh 2>&1
          )
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::Production transport guard accepted embedded Basic credentials."
            exit 1
          fi

          echo "$output" | grep -q "SAP_BASIC_AUTH_USER/SAP_BASIC_AUTH_PASSWORD must not be embedded in a production release"
