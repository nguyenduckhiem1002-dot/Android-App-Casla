name: Flutter CI

on:
  push:
    branches: [main, master, develop, 'chatgpt/**']
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('casla_production/pubspec.lock') }}

      - name: Verify Flutter and Dart versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

  android:
    name: Android / PDA build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('casla_production/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Compile production flavor APK including native scanner bridge
        run: flutter build apk --debug --flavor production --no-pub

      - name: Verify production release fails closed without secrets
        working-directory: casla_production/android
        run: |
          ./gradlew :app:tasks --all | grep -q assembleProductionRelease

          set +e
          output=$(./gradlew :app:verifyCaslaSigning 2>&1)
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::Production signing guard unexpectedly passed in secret-free CI."
            exit 1
          fi

          echo "$output" | grep -q "Production Android release is not configured"

  ios:
    name: iOS / Xcode build
    runs-on: macos-14
    defaults:
      run:
        working-directory: casla_production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('casla_production/pubspec.lock') }}

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Validate Xcode archive settings
        working-directory: casla_production/ios
        run: >-
          xcodebuild -workspace Runner.xcworkspace
          -scheme Runner
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
