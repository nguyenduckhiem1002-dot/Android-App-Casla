version: 2
updates:
  - package-ecosystem: pub
    directory: /casla_production
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      flutter-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
      flutter-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /casla_production/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      android-build:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
